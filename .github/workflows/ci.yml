name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch to avoid wasting resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.x"

jobs:
  ci:
    name: Lint · Test · Smoke
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up Python
      # ------------------------------------------------------------------ #
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------------------ #
      # 3. Install uv
      # ------------------------------------------------------------------ #
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      # ------------------------------------------------------------------ #
      # 4. Cache uv virtualenv
      # ------------------------------------------------------------------ #
      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      # ------------------------------------------------------------------ #
      # 5. Install dependencies (dev extras for pytest + ruff)
      # ------------------------------------------------------------------ #
      - name: Install dependencies
        run: uv sync --extra dev

      # ------------------------------------------------------------------ #
      # 6. Lint: ruff check
      # ------------------------------------------------------------------ #
      - name: Ruff lint check
        run: uv run ruff check src/ tests/ scripts/

      # ------------------------------------------------------------------ #
      # 7. Lint: ruff format check
      # ------------------------------------------------------------------ #
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      # ------------------------------------------------------------------ #
      # 8. Unit + integration tests
      #    models/ is gitignored, so no model artifact is checked out here.
      #    tests/conftest.py generates a synthetic stand-in at this path before
      #    the API tests import src.api — no trained artifact is required.
      # ------------------------------------------------------------------ #
      - name: Run pytest
        env:
          MODEL_PATH: models/baseline_lr.pkl
          # Use an isolated MLflow DB so tests don't touch production
          MLFLOW_TRACKING_URI: sqlite:///ci_mlflow.db
        run: uv run pytest tests/ -v --tb=short

      # ------------------------------------------------------------------ #
      # 9. Pipeline smoke test (synthetic tiny dataset — no Kaggle needed)
      # ------------------------------------------------------------------ #
      - name: Generate synthetic smoke dataset
        run: |
          uv run python - <<'EOF'
          import numpy as np
          import pandas as pd
          from pathlib import Path

          rng = np.random.default_rng(42)
          n = 1000
          data = {"Time": rng.uniform(0, 172792, n)}
          for i in range(1, 29):
              data[f"V{i}"] = rng.standard_normal(n)
          data["Amount"] = rng.uniform(0.01, 500, n)
          # ~2% fraud
          labels = np.zeros(n, dtype=int)
          fraud_idx = rng.choice(n, size=20, replace=False)
          labels[fraud_idx] = 1
          data["Class"] = labels

          Path("data/raw").mkdir(parents=True, exist_ok=True)
          pd.DataFrame(data).to_csv("data/raw/creditcard.csv", index=False)
          print(f"Smoke dataset written: {n} rows, 20 fraud")
          EOF

      - name: Run training pipeline smoke test
        env:
          MLFLOW_TRACKING_URI: sqlite:///ci_mlflow.db
          SMOKE_TEST: "1"
        run: |
          uv run python - <<'SMOKE'
          import logging
          logging.basicConfig(level=logging.WARNING)

          from sklearn.linear_model import LogisticRegression

          from src.config import RAW_DATA_PATH
          from src.evaluate import evaluate_model
          from src.features import (
              apply_amount_scaler,
              fit_amount_scaler,
              load_data,
              preprocess,
              split_data,
          )

          # End-to-end, in the leak-free order: split BEFORE any fitted transform.
          df = load_data(RAW_DATA_PATH)
          X, y = preprocess(df)
          X_train, X_val, X_test, y_train, y_val, y_test = split_data(X, y)

          # preprocess() must not have scaled anything yet.
          assert (X["Amount"] == df["Amount"]).all(), "preprocess() scaled Amount -- leak!"

          # The three splits must partition the data with no overlap.
          assert len(X_train) + len(X_val) + len(X_test) == len(X)
          assert set(X_train.index).isdisjoint(X_val.index)
          assert set(X_train.index).isdisjoint(X_test.index)
          assert set(X_val.index).isdisjoint(X_test.index)

          scaler = fit_amount_scaler(X_train)
          assert scaler.mean_[0] == X_train["Amount"].mean(), "scaler saw more than train"
          X_train = apply_amount_scaler(scaler, X_train)
          X_val = apply_amount_scaler(scaler, X_val)
          X_test = apply_amount_scaler(scaler, X_test)

          model = LogisticRegression(class_weight="balanced", max_iter=200, random_state=42)
          model.fit(X_train, y_train)

          val_metrics = evaluate_model(model, X_val, y_val)
          test_metrics = evaluate_model(model, X_test, y_test)
          print("Pipeline smoke test passed!")
          print(f"  val  PR-AUC: {val_metrics['pr_auc']:.4f}  recall: {val_metrics['recall']:.4f}")
          print(f"  test PR-AUC: {test_metrics['pr_auc']:.4f}  recall: {test_metrics['recall']:.4f}")

          # Validation gate: decisions are made on VAL, never on test.
          from unittest.mock import MagicMock, patch

          from mlflow.exceptions import MlflowException

          from src.validate import ValidationStatus, run_validation_gate

          mock_client = MagicMock()
          mock_client.get_model_version_by_alias.side_effect = MlflowException("Not found")
          with patch("src.validate.mlflow.register_model") as mock_reg:
              mock_reg.return_value = MagicMock(version="1")
              result = run_validation_gate("fake-run", val_metrics, client=mock_client)
          assert result.status in (
              ValidationStatus.FIRST_DEPLOYMENT,
              ValidationStatus.PROMOTED,
              ValidationStatus.REJECTED,
          )
          print(f"  Validation gate: {result.status.value}")
          print("All smoke tests passed!")
          SMOKE

      # ------------------------------------------------------------------ #
      # 10. Upload test artifacts on failure (optional)
      # ------------------------------------------------------------------ #
      - name: Upload CI MLflow DB on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mlflow-db
          path: ci_mlflow.db
          retention-days: 3
