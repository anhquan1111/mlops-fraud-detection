# Cấu hình model, siêu tham số và ngưỡng nghiệm thu
registered_model_name: "fraud-detection-model"
model_artifact_filename: "baseline_lr.pkl"
min_recall: 0.80
min_precision: 0.50

logistic_regression:
  class_weight: "balanced"
  max_iter: 1000
  random_state: 42
  solver: "lbfgs"

xgboost_base_params:
  eval_metric: "aucpr"
  random_state: 42
  n_jobs: -1
  tree_method: "hist"
  early_stopping_rounds: 20

xgboost_grid:
  - n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 1.0
    colsample_bytree: 1.0
    run_name: "xgb_default"
  - n_estimators: 200
    max_depth: 8
    learning_rate: 0.05
    subsample: 1.0
    colsample_bytree: 0.8
    run_name: "xgb_deep"
  - n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    run_name: "xgb_regularized"

lightgbm_base_params:
  class_weight: "balanced"
  metric: "average_precision"
  random_state: 42
  n_jobs: -1
  verbose: -1

lightgbm_grid:
  - n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    num_leaves: 31
    subsample: 1.0
    colsample_bytree: 1.0
    run_name: "lgbm_default"
  - n_estimators: 300
    max_depth: -1
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.9
    colsample_bytree: 0.8
    run_name: "lgbm_large"
  - n_estimators: 300
    max_depth: -1
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 5
    run_name: "lgbm_regularized"
