[project]
name = "mlops-fraud-detection"
version = "0.1.0"
description = "MLOps pipeline for credit card fraud detection with MLflow tracking, model registry, and FastAPI serving"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "anhquan1111" }]

dependencies = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "huggingface_hub>=0.26.0",
    "kaggle>=2.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
notebook = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
