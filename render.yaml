services:
  - type: web
    name: fraud-detection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Model source: Hugging Face Hub (recommended for Render)
      # 1. Upload model: HF_TOKEN=hf_xxx HF_REPO_ID=username/repo uv run python scripts/export_model.py --upload
      # 2. Set these env vars on Render dashboard or uncomment below:
      - key: HF_REPO_ID
        value: votrananhquan/fraud-detection-model
      # HF_TOKEN only needed for private repos — leave unset for public repos
      # - key: HF_TOKEN
      #   fromSecret: HF_TOKEN
